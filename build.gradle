plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.0.171'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Compile-time only. At runtime MMCR / JEI / EMI are ordinary mod dependencies,
    // declared in META-INF/neoforge.mods.toml.
    compileOnly files("libs/${mmcr_jar}")
    compileOnly files("libs/${jei_jar}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
        ])
    }
}
