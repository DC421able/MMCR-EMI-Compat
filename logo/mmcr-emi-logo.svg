<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2266"/>
      <stop offset="0.55" stop-color="#8b3fd1"/>
      <stop offset="1" stop-color="#d94ff0"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e6dccb"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63f39a"/>
      <stop offset="1" stop-color="#2cc465"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="8" y="8" width="496" height="496" rx="112" ry="112"
        fill="url(#bg)" stroke="#1d1136" stroke-width="16"/>

  <!-- 3x3 item slots -->
  <g>
    <!-- row 1 -->
    <rect x="101" y="101" width="90" height="90" rx="12" fill="#cfc2ae"/>
    <rect x="101" y="101" width="90" height="90" rx="12" fill="#f4eee6"/>
    <rect x="211" y="101" width="90" height="90" rx="12" fill="#cfc2ae"/>
    <rect x="211" y="101" width="90" height="90" rx="12" fill="#f4eee6"/>
    <rect x="321" y="101" width="90" height="90" rx="12" fill="#cfc2ae"/>
    <rect x="321" y="101" width="90" height="90" rx="12" fill="#f4eee6"/>
    <!-- row 2 (behind arrow) -->
    <rect x="101" y="211" width="90" height="90" rx="12" fill="#cfc2ae"/>
    <rect x="101" y="211" width="90" height="90" rx="12" fill="#f4eee6"/>
    <rect x="211" y="211" width="90" height="90" rx="12" fill="#cfc2ae"/>
    <rect x="211" y="211" width="90" height="90" rx="12" fill="#f4eee6"/>
    <rect x="321" y="211" width="90" height="90" rx="12" fill="#cfc2ae"/>
    <rect x="321" y="211" width="90" height="90" rx="12" fill="#f4eee6"/>
    <!-- row 3 -->
    <rect x="101" y="321" width="90" height="90" rx="12" fill="#cfc2ae"/>
    <rect x="101" y="321" width="90" height="90" rx="12" fill="#f4eee6"/>
    <rect x="211" y="321" width="90" height="90" rx="12" fill="#cfc2ae"/>
    <rect x="211" y="321" width="90" height="90" rx="12" fill="#f4eee6"/>
    <rect x="321" y="321" width="90" height="90" rx="12" fill="#cfc2ae"/>
    <rect x="321" y="321" width="90" height="90" rx="12" fill="#f4eee6"/>
  </g>

  <!-- recipe arrow across the middle -->
  <g stroke="#1d1136" stroke-width="10" stroke-linejoin="round">
    <path d="M56 236 H360 V206 L456 256 L360 306 V276 H56 Z" fill="url(#arrow)"/>
  </g>

  <!-- compatibility check badge -->
  <g>
    <circle cx="416" cy="416" r="72" fill="#1d1136"/>
    <circle cx="416" cy="416" r="62" fill="url(#check)"/>
    <path d="M384 416 l22 24 l42 -48" fill="none" stroke="#0e3a1f" stroke-width="16"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
